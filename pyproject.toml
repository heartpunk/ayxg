[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayxg"
version = "0.1.0"
requires-python = ">=3.11"
description = "Typed structured transition systems and segment interfaces"

[project.optional-dependencies]
z3 = ["z3-solver==4.13.0.0"]
test = ["pytest>=8", "hypothesis>=6", "z3-solver==4.13.0.0"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["ayxg*"]

[tool.setuptools.package-data]
ayxg = ["py.typed"]
